<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>教學原理｜課堂報告互評</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#203b5b;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#fff;border-bottom:1px solid #e1e8f1;padding:14px 18px;font-weight:750}main{max-width:980px;margin:0 auto}iframe{display:block;border:0;width:100%;height:1350px;background:#f5f7fb}
footer{text-align:center;font-size:13px;color:#61748b;padding:12px 16px 24px}a{color:#244eb1}
</style>
</head>
<body>
<header>教學原理　｜　跨週次報告互評</header>
<main>
  <iframe id="app" title="教學原理互評表" src="https://script.google.com/macros/s/AKfycbw_CMxDIgfxnyxX1r8PY20Z-sSD0Gq-60e5B7ws99bk7mLxNMpUphwgQ86ulQDTVmmg6w/exec" referrerpolicy="no-referrer" allow="clipboard-write"></iframe>
  <footer>如果網頁內無法操作，請 <a href="https://script.google.com/macros/s/AKfycbw_CMxDIgfxnyxX1r8PY20Z-sSD0Gq-60e5B7ws99bk7mLxNMpUphwgQ86ulQDTVmmg6w/exec" target="_blank" rel="noopener noreferrer">直接開啟互評表</a>。</footer>
</main>
<script>
window.addEventListener('message',function(event){
 // GAS HtmlService 可能有額外巢狀 iframe，因此僅驗證訊息來源網域。
 if(!/^https:\/\/(script\.google\.com|([a-z0-9-]+\.)*googleusercontent\.com)$/i.test(event.origin))return;
 if(event.data&&event.data.type==='tpv5-height'&&Number.isFinite(event.data.height)){
  document.getElementById('app').style.height=Math.min(3000,Math.max(700,event.data.height))+'px';
 }
});
</script>
</body></html>
