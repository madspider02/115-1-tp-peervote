<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="教學原理課堂報告互評：每週選出欣賞的報告組別，並留下 30 字內心得。">
  <title>教學原理｜課堂報告互評</title>
  <style>
    :root {
      --ink: #172a44;
      --muted: #65758a;
      --line: #e3e9f1;
      --blue: #315ed7;
      --blue-soft: #edf3ff;
      --teal: #087f78;
      --page: #f6f8fc;
      --white: #fff;
      --shadow: 0 18px 55px rgba(24, 46, 78, .065);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.65;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible, input:focus-visible + .radio-visual {
      outline: 3px solid rgba(49, 94, 215, .28);
      outline-offset: 3px;
    }
    .wrap { width: min(100% - 36px, 850px); margin-inline: auto; }
    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .header-content {
      min-height: 79px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 760; letter-spacing: .015em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 41px;
      height: 41px;
      border-radius: 13px;
      background: #e9efff;
      color: var(--blue);
      font-size: 21px;
    }
    .header-tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
    main { padding-top: 31px; padding-bottom: 48px; }
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(125deg, #183253, #203f75 65%, #285887);
      border-radius: 25px;
      color: white;
      padding: 31px 37px 35px;
      isolation: isolate;
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;
    }
    .hero::before { width: 330px; height: 330px; right: -90px; top: -180px; }
    .hero::after { width: 250px; height: 250px; right: 65px; bottom: -210px; }
    .eyebrow {
      color: #acc8ff;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .11em;
      margin-bottom: 10px;
    }
    .hero h1 { font-size: clamp(25px, 4.5vw, 35px); line-height: 1.4; letter-spacing: .03em; margin: 0 0 10px; }
    .hero p { margin: 0; color: #d4e0f3; font-size: 14px; max-width: 550px; }
    .hero-points { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 21px; }
    .hero-point {
      border: 1px solid rgba(215, 231, 255, .25);
      background: rgba(255, 255, 255, .085);
      padding: 5px 11px;
      border-radius: 100px;
      font-size: 12px;
      color: #f0f6ff;
    }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 29px 1px 13px;
    }
    .section-heading h2 { margin: 0; font-size: 16px; letter-spacing: .015em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .weeks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .week-tab {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: 15px;
      padding: 14px 16px 13px;
      text-align: left;
      min-height: 108px;
      color: var(--ink);
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .week-tab:hover { border-color: #b0c3ee; transform: translateY(-1px); }
    .week-tab.selected { border-color: var(--blue); box-shadow: 0 0 0 3px #e7edff; }
    .week-tab:disabled { cursor: wait; transform: none; }
    .week-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .week-index { font-weight: 700; color: #8190a4; font-size: 12px; }
    .week-date { font-weight: 810; font-size: 24px; letter-spacing: -.025em; line-height: 1.4; margin: 4px 0 3px; }
    .week-state { font-size: 11px; white-space: nowrap; border-radius: 50px; padding: 2px 7px; background: #f0f3f8; color: #768394; }
    .week-state.open { background: #e6f6f2; color: #087f78; }
    .week-state.done { background: #e8efff; color: var(--blue); }
    .card {
      margin-top: 18px;
      background: var(--white);
      border: 1px solid #e7ecf3;
      border-radius: 21px;
      box-shadow: var(--shadow);
      padding: 30px 35px 33px;
    }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .card-kicker { font-size: 12px; font-weight: 750; color: var(--blue); margin: 0 0 4px; }
    .card-title { margin: 0; font-size: clamp(19px, 3.6vw, 24px); letter-spacing: -.02em; line-height: 1.5; }
    .card-desc { margin: 9px 0 22px; color: var(--muted); font-size: 13px; }
    .status-pill { font-size: 12px; font-weight: 750; white-space: nowrap; padding: 6px 11px; border-radius: 50px; background: #f1f4f9; color: #718094; }
    .status-pill.open { background: #e6f6f2; color: #087f78; }
    .form-label { display: block; font-size: 14px; font-weight: 760; margin-bottom: 10px; }
    .choices { display: grid; gap: 11px; margin-bottom: 25px; }
    .choice { position: relative; display: block; cursor: pointer; }
    .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .radio-visual {
      min-height: 88px;
      border: 1.5px solid #e0e7f0;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: background .15s, border-color .15s;
      background: #fff;
    }
    .choice:hover .radio-visual { border-color: #a9bce8; }
    .choice input:checked + .radio-visual { border-color: var(--blue); background: #f3f7ff; }
    .choice input:disabled + .radio-visual { opacity: .65; cursor: not-allowed; }
    .choice input:checked:disabled + .radio-visual { opacity: 1; }
    .choice-name { display: block; color: var(--muted); font-size: 12px; font-weight: 750; margin-bottom: 3px; }
    .choice-topic { display: block; color: var(--ink); font-size: 16px; font-weight: 800; }
    .choice-radio {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 2px solid #c5cfdd;
      flex: none;
      display: grid;
      place-items: center;
      background: white;
    }
    .choice-radio::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--blue); transform: scale(0); transition: transform .15s; }
    .choice input:checked + .radio-visual .choice-radio { border-color: var(--blue); }
    .choice input:checked + .radio-visual .choice-radio::after { transform: scale(1); }
    .comment-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    textarea {
      display: block;
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1.5px solid #dfe6f0;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.65;
    }
    textarea::placeholder { color: #9aa7b7; }
    textarea:disabled { background: #f8f9fc; }
    .form-end {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 19px;
    }
    .helper { font-size: 12px; line-height: 1.5; color: var(--muted); max-width: 360px; }
    .submit-btn {
      flex: none;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: #fff;
      background: var(--blue);
      font-weight: 780;
      font-size: 14px;
      box-shadow: 0 6px 18px rgba(49, 94, 215, .2);
      transition: transform .2s, background .2s;
    }
    .submit-btn:not(:disabled):hover { background: #244dbb; transform: translateY(-1px); }
    .submit-btn:disabled { box-shadow: none; background: #b1bfd5; cursor: not-allowed; }
    .message { display: none; border-radius: 12px; padding: 11px 14px; font-size: 13px; line-height: 1.6; margin-top: 16px; }
    .message.show { display: block; }
    .message.info { background: #f0f4fc; color: #365480; }
    .message.error { background: #fff0ee; color: #a13b33; }
    .message.success { background: #eaf8f3; color: #0b6958; }
    .notice {
      padding: 20px 19px;
      background: #f7f9fc;
      border: 1px solid #edf0f6;
      border-radius: 14px;
      color: #586b80;
      font-size: 14px;
      line-height: 1.8;
    }
    .notice strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 3px; }
    .notice.success { background: #edf9f4; border-color: #d3eee2; }
    .notice.success strong { color: #087f78; }
    .footnote { text-align: center; color: #8995a5; font-size: 12px; margin-top: 24px; }
    @media(max-width: 620px) {
      .wrap { width: min(100% - 26px, 850px); }
      .header-content { min-height: 67px; }
      .header-tag { display: none; }
      main { padding-top: 16px; }
      .hero { padding: 26px 23px 27px; border-radius: 19px; }
      .weeks { gap: 8px; }
      .week-tab { padding: 12px 10px; min-height: 107px; border-radius: 12px; }
      .week-top { display: block; }
      .week-state { display: inline-block; margin-top: 4px; font-size: 10px; }
      .week-date { font-size: 21px; margin-top: 2px; }
      .card { padding: 24px 19px 25px; border-radius: 17px; }
      .card-top { display: block; }
      .status-pill { display: inline-block; margin-top: 10px; }
      .form-end { align-items: stretch; flex-direction: column; }
      .submit-btn { width: 100%; }
      .choice-topic { font-size: 15px; }
    }
    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-content">
      <div class="brand"><span class="brand-mark" aria-hidden="true">教</span><span>教學原理</span></div>
      <span class="header-tag">2026 秋季課程 · 課堂報告互評</span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <div class="eyebrow">TEACHING PRINCIPLES · PEER FEEDBACK</div>
      <h1 id="hero-title">每一份精彩報告，都值得被看見。</h1>
      <p>選出這一週你最欣賞的報告組別，並用一句話分享值得學習的地方。</p>
      <div class="hero-points" aria-label="填寫說明">
        <span class="hero-point">每週選 1 組</span>
        <span class="hero-point">心得最多 30 字</span>
        <span class="hero-point">不需填寫姓名</span>
      </div>
    </section>

    <div class="section-heading">
      <h2>選擇報告週次</h2>
      <p>依臺灣時間於報告當週開放</p>
    </div>
    <nav id="week-tabs" class="weeks" aria-label="報告日期"></nav>

    <section class="card" id="weekly-panel" aria-live="polite"></section>
    <p class="footnote">感謝你給予同學具體、友善的回饋 · 資料僅供本課程教學使用</p>
  </main>

  <!-- This hidden iframe transports an ordinary HTML form POST to Google Apps Script. -->
  <form id="sheet-form" method="POST" target="sheet-response-frame" style="display:none" aria-hidden="true">
    <input name="requestId" type="hidden">
    <input name="weekId" type="hidden">
    <input name="groupId" type="hidden">
    <input name="comment" type="hidden">
  </form>
  <iframe id="sheet-response-frame" name="sheet-response-frame" title="Google Sheet 資料提交回應" style="display:none"></iframe>

  <script>
    "use strict";

    // STEP 4: Replace the value below with your deployed Apps Script Web App URL (/exec).
    const WEB_APP_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_EXEC_URL_HERE";

    // Only the group number and presentation topic are stored here, NOT student names.
    const WEEKS = [
      { id: "2026-11-23", end: "2026-11-29", label: "11/23", ordinal: "第一週", groups: [
        { id: 1, topic: "工作分析教學法" },
        { id: 2, topic: "協同教學法" }
      ]},
      { id: "2026-12-07", end: "2026-12-13", label: "12/7", ordinal: "第二週", groups: [
        { id: 3, topic: "探究教學法／講述教學法" },
        { id: 4, topic: "直接教學法" }
      ]},
      { id: "2026-12-14", end: "2026-12-20", label: "12/14", ordinal: "第三週", groups: [
        { id: 5, topic: "討論教學法" },
        { id: 6, topic: "結構式教學法" }
      ]}
    ];

    const MESSAGE_SOURCE = "teaching-principles-vote-2026";
    const STORE_PREFIX = "teaching-principles-vote-2026-";
    const state = {
      weekId: null,
      choices: {},
      drafts: {},
      completed: {},
      sending: false,
      pendingAttempt: null,
      responseTimer: null
    };
    const tabsNode = document.getElementById("week-tabs");
    const panelNode = document.getElementById("weekly-panel");
    const transportForm = document.getElementById("sheet-form");

    function taiwanDate() {
      const pieces = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const dict = Object.fromEntries(pieces.map(p => [p.type, p.value]));
      return `${dict.year}-${dict.month}-${dict.day}`;
    }

    function weekStatus(week) {
      const today = taiwanDate();
      if (today < week.id) return "upcoming";
      if (today > week.end) return "closed";
      return "open";
    }

    function hasCompleted(weekId) {
      if (state.completed[weekId]) return true;
      try { return localStorage.getItem(STORE_PREFIX + weekId) === "submitted"; }
      catch (_) { return false; }
    }

    function setCompleted(weekId) {
      state.completed[weekId] = true;
      try { localStorage.setItem(STORE_PREFIX + weekId, "submitted"); }
      catch (_) { /* Browsers may disable local storage. */ }
    }

    function statusText(status, completed) {
      if (completed) return "已填寫";
      if (status === "open") return "填寫中";
      return status === "closed" ? "已截止" : "尚未開放";
    }

    function initializeWeek() {
      const preferred = WEEKS.find(w => weekStatus(w) === "open" && !hasCompleted(w.id))
        || WEEKS.find(w => weekStatus(w) === "open")
        || WEEKS.find(w => weekStatus(w) === "upcoming")
        || WEEKS[WEEKS.length - 1];
      state.weekId = preferred.id;
    }

    function currentWeek() { return WEEKS.find(w => w.id === state.weekId); }

    function renderTabs() {
      tabsNode.replaceChildren();
      for (const week of WEEKS) {
        const selected = week.id === state.weekId;
        const status = weekStatus(week);
        const completed = hasCompleted(week.id);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `week-tab${selected ? " selected" : ""}`;
        button.setAttribute("aria-pressed", String(selected));
        button.disabled = state.sending || Boolean(state.pendingAttempt);
        button.innerHTML = `
          <span class="week-top"><span class="week-index">${week.ordinal}</span></span>
          <span class="week-date">${week.label}</span>
          <span class="week-state ${completed ? "done" : (status === "open" ? "open" : "")}">${statusText(status, completed)}</span>`;
        button.addEventListener("click", () => {
          if (state.sending || state.pendingAttempt) return;
          state.weekId = week.id;
          render();
        });
        tabsNode.appendChild(button);
      }
    }

    function renderPanel() {
      const week = currentWeek();
      const status = weekStatus(week);
      const completed = hasCompleted(week.id);
      const isOpen = status === "open";
      let inner = `
        <div class="card-top">
          <div>
            <p class="card-kicker">${week.ordinal} · ${week.label}（週一）</p>
            <h2 class="card-title">本週報告互評</h2>
          </div>
          <span class="status-pill ${isOpen && !completed ? "open" : ""}">${statusText(status, completed)}</span>
        </div>`;

      if (completed) {
        inner += `<p class="card-desc">本週的互評已完成。</p>
          <div class="notice success"><strong>✓ 感謝你的回饋！</strong>本週已完成填寫。歡迎在下一個報告週次繼續參與互評。</div>`;
        panelNode.innerHTML = inner;
        return;
      }

      if (!isOpen) {
        const description = status === "upcoming"
          ? `請於 ${week.label}（週一）至當週週日進行互評。你可以先查看本週報告主題。`
          : `本週互評已於 ${week.end.replaceAll("-", "/")} 23:59（臺灣時間）截止。`;
        inner += `<p class="card-desc">${description}</p>`;
        inner += `<div class="choices" aria-label="本週報告主題">` + week.groups.map(group => `
          <div class="radio-visual">
            <div><span class="choice-name">第 ${group.id} 組</span><span class="choice-topic">${group.topic}</span></div>
          </div>`).join("") + `</div>`;
        inner += `<div class="notice"><strong>${status === "upcoming" ? "尚未開始填寫" : "已結束填寫"}</strong>${description}</div>`;
        panelNode.innerHTML = inner;
        return;
      }

      inner += `
        <p class="card-desc">請選擇你認為本週表現最好的報告組別，並留下簡短的欣賞理由。</p>
        <form id="vote-form" novalidate>
          <div class="form-label" id="vote-label">01　選擇一個報告組別</div>
          <div class="choices" role="radiogroup" aria-labelledby="vote-label">
            ${week.groups.map(group => `
              <label class="choice">
                <input type="radio" name="voteChoice" value="${group.id}" ${state.choices[week.id] === group.id ? "checked" : ""}>
                <span class="radio-visual">
                  <span><span class="choice-name">第 ${group.id} 組</span><span class="choice-topic">${group.topic}</span></span>
                  <span class="choice-radio" aria-hidden="true"></span>
                </span>
              </label>`).join("")}
          </div>
          <div class="comment-top">
            <label class="form-label" for="vote-comment">02　給這組一句心得</label>
            <span class="count" id="comment-count">0 / 30 字</span>
          </div>
          <textarea id="vote-comment" rows="3" placeholder="例如：教學步驟很清楚，示範容易理解" aria-describedby="comment-count"></textarea>
          <div class="form-end">
            <span class="helper">只需選組別、寫心得。無須填姓名；請依實際報告內容給予友善回饋。</span>
            <button id="submit-btn" class="submit-btn" type="submit" disabled>送出本週互評</button>
          </div>
          <div id="form-message" class="message" role="status" aria-live="polite"></div>
        </form>`;
      panelNode.innerHTML = inner;

      const voteForm = document.getElementById("vote-form");
      const comment = document.getElementById("vote-comment");
      comment.value = state.drafts[week.id] || "";
      voteForm.addEventListener("change", event => {
        if (event.target.name === "voteChoice") {
          state.choices[week.id] = Number(event.target.value);
          syncSubmitState();
        }
      });
      comment.addEventListener("input", () => {
        // Count visible Unicode characters instead of UTF-16 code units.
        const chars = Array.from(comment.value);
        if (chars.length > 30) comment.value = chars.slice(0, 30).join("");
        state.drafts[week.id] = comment.value;
        document.getElementById("comment-count").textContent = `${Array.from(comment.value).length} / 30 字`;
        syncSubmitState();
      });
      voteForm.addEventListener("submit", handleSubmit);
      document.getElementById("comment-count").textContent = `${Array.from(comment.value).length} / 30 字`;
      syncSubmitState();
    }

    function syncSubmitState() {
      const button = document.getElementById("submit-btn");
      const comment = document.getElementById("vote-comment");
      if (!button || !comment) return;
      const locked = state.sending || Boolean(state.pendingAttempt);
      const week = currentWeek();
      for (const choice of document.querySelectorAll('input[name="voteChoice"]')) choice.disabled = locked;
      comment.disabled = locked;
      if (state.sending) {
        button.disabled = true;
        button.textContent = "正在送出…";
      } else if (state.pendingAttempt) {
        button.disabled = false;
        button.textContent = "再次確認送出";
      } else {
        const validChoice = week.groups.some(g => g.id === state.choices[week.id]);
        const length = Array.from((comment.value || "").replace(/\s+/g, " ").trim()).length;
        button.disabled = !validChoice || length < 1 || length > 30 || weekStatus(week) !== "open";
        button.textContent = "送出本週互評";
      }
    }

    function showMessage(kind, text) {
      const message = document.getElementById("form-message");
      if (!message) return;
      message.className = `message show ${kind}`;
      message.textContent = text;
    }

    function isConfigured() {
      return WEB_APP_URL.startsWith("https://script.google.com/") && WEB_APP_URL.includes("/exec");
    }

    function uniqueId() {
      if (globalThis.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
    }

    function handleSubmit(event) {
      event.preventDefault();
      if (state.sending) return;
      if (state.pendingAttempt) { sendAttempt(state.pendingAttempt); return; }
      if (!isConfigured()) {
        showMessage("error", "網站尚未連接 Google Sheet，請通知授課教師設定 Apps Script 網址。");
        return;
      }
      const week = currentWeek();
      if (weekStatus(week) !== "open") {
        showMessage("error", "目前不在本週的開放期間，請重新選擇週次。");
        return;
      }
      const groupId = state.choices[week.id];
      const comment = (state.drafts[week.id] || "").replace(/\s+/g, " ").trim();
      if (!week.groups.some(g => g.id === groupId) || Array.from(comment).length < 1 || Array.from(comment).length > 30) {
        showMessage("error", "請選擇一個組別，並填寫 1 至 30 字的心得。");
        return;
      }
      state.pendingAttempt = { requestId: uniqueId(), weekId: week.id, groupId, comment };
      sendAttempt(state.pendingAttempt);
    }

    function sendAttempt(attempt) {
      if (!isConfigured()) { showMessage("error", "請通知授課教師設定 Apps Script 網址。"); return; }
      state.sending = true;
      renderTabs();
      syncSubmitState();
      showMessage("info", "正在將互評寫入 Google Sheet，請勿關閉網頁。");
      transportForm.action = WEB_APP_URL;
      for (const key of ["requestId", "weekId", "groupId", "comment"]) {
        transportForm.elements.namedItem(key).value = attempt[key];
      }
      try { transportForm.submit(); }
      catch (_) {
        state.sending = false;
        state.pendingAttempt = null;
        renderTabs();
        syncSubmitState();
        showMessage("error", "表單無法送出，請確認網路連線後重試。");
        return;
      }
      clearTimeout(state.responseTimer);
      state.responseTimer = setTimeout(() => {
        if (!state.pendingAttempt || state.pendingAttempt.requestId !== attempt.requestId) return;
        state.sending = false;
        renderTabs();
        syncSubmitState();
        showMessage("error", "目前無法確認 Sheet 是否已收到。請先確認網路，再點「再次確認送出」；相同提交編號不會重複寫入。若持續發生，請聯絡老師。");
      }, 18000);
    }

    window.addEventListener("message", event => {
      const allowed = event.origin === "https://script.google.com"
        || /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(event.origin);
      if (!allowed) return;
      const reply = event.data;
      if (!reply || typeof reply !== "object" || reply.source !== MESSAGE_SOURCE) return;
      if (!state.pendingAttempt || reply.requestId !== state.pendingAttempt.requestId) return;
      clearTimeout(state.responseTimer);
      state.responseTimer = null;
      state.sending = false;
      const attempt = state.pendingAttempt;
      if (reply.ok === true) {
        setCompleted(attempt.weekId);
        state.pendingAttempt = null;
        render();
      } else {
        state.pendingAttempt = null;
        renderTabs();
        syncSubmitState();
        showMessage("error", reply.message || "無法完成送出，請再試一次。");
      }
    });

    function render() { renderTabs(); renderPanel(); }
    initializeWeek();
    render();
  </script>
</body>
</html>
